name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel an image publish halfway: a cancelled run could leave
# :edge pushed but unsigned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pushing the image and keyless signing need these two and nothing else.
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/devcules/devcules
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for a Dockerfile
        id: gate
        run: |
          if [ ! -f Dockerfile ]; then
            echo "SKIP: no Dockerfile yet (the image lands with M0.5); nothing to build or push."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/devcules/devcules:edge
            ghcr.io/devcules/devcules:sha-${{ github.sha }}
      - name: SBOM
        if: steps.gate.outputs.build == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/devcules/devcules:sha-${{ github.sha }}
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Install cosign
        if: steps.gate.outputs.build == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attach SBOM
        if: steps.gate.outputs.build == 'true'
        run: |
          cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE@${{ steps.build.outputs.digest }}"
