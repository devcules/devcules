# Gitleaks allowlists: known false positives, each with its reason.
# Gitleaks discovers this file automatically; CI needs no flag change.
# A config file replaces the built-in rules unless it extends them, so
# without [extend] the scan would run with no rules at all.

[extend]
useDefault = true

[[allowlists]]
description = "The bootstrap password alphabet is a public character set, not a credential."
regexes = ['''abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRTUVWXY346789''']

[[allowlists]]
description = "Redaction fixtures: made-up values in real key shapes, and the converted Gitleaks rule data itself (its allowlists quote documented example keys)."
paths = [
    '''^internal/redact/testdata/''',
    '''^internal/redact/rules/gitleaks\.json$''',
]

[[allowlists]]
description = "Serve test fixture: base64 of TOPSECRET-VAULT-KEY-32-BYTES-!!!, a made-up vault key the tests assert never reaches a log."
regexes = ['''^VE9QU0VDUkVULVZBVUxULUtFWS0zMi1CWVRFUy0hISE=$''']

[[allowlists]]
description = "c7e3fde's provider key tests held made-up sk-… values in full; later tests build them from parts. Only that commit is excused, so a new full-shape key still fails the scan."
commits = ['''c7e3fded8222f3a0becbe6b1bbd6f1d7a26bbacf''']
