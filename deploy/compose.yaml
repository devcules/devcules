# M0.5 local stack. Run from the repo root:
#
#   docker compose -f deploy/compose.yaml up -d --wait
#
# Both services build the same Dockerfile locally: the :latest tag does
# not exist until the first release, so there is nothing to pull yet.
# The vault key stays optional (serve generates one), provider keys go
# to serve only, and the runner carries no secrets at all.
#
# M1.3 link: the `link` volume carries the runner token file. Serve
# mints it at /link/runner.token (read-write); the runner reads it
# (read-only). Rotation is delete-the-file plus restart both services.

services:
  serve:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/devcules/devcules:${DEVCULES_TAG:-edge}
    command: ["serve"]
    environment:
      DEVCULES_LISTEN: "0.0.0.0:7659"
      DEVCULES_PUBLIC_URL: ${DEVCULES_PUBLIC_URL:-}
      DEVCULES_RUNNER_TOKEN_FILE: /link/runner.token
      # M2.3: the Meta Model API key moves into the vault on first
      # start (then it can leave the environment); the base URL is for
      # a regional endpoint or the smoke test's mock provider.
      META_API_KEY: ${META_API_KEY:-}
      DEVCULES_META_BASE_URL: ${DEVCULES_META_BASE_URL:-}
      # M2.4: days of model call traces to keep (empty = 30).
      DEVCULES_TRACE_DAYS: ${DEVCULES_TRACE_DAYS:-}
      # M3.2: the contact push services see for approval notices
      # (empty = the public URL when it is https).
      DEVCULES_PUSH_CONTACT: ${DEVCULES_PUSH_CONTACT:-}
    volumes:
      - devcules-data:/data
      - link:/link
    ports:
      - "127.0.0.1:7659:7659"
    healthcheck:
      test: ["CMD", "devcules", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  runner:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/devcules/devcules:${DEVCULES_TAG:-edge}
    command: ["runner"]
    # tini reaps the tmux server's zombies. tmux sessions die with the
    # runner container; reattach after a restart starts a fresh shell.
    init: true
    environment:
      DEVCULES_SERVE_URL: http://serve:7659
      DEVCULES_RUNNER_TOKEN_FILE: /link/runner.token
    volumes:
      - ${DEVCULES_CODE_DIR:-~/code}:/workspace
      - runner-home:/home/devcules
      - link:/link:ro
    depends_on:
      serve:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Phone over the tailnet (M6.2): `docker compose --profile tailscale
  # up -d --wait`, with TS_AUTHKEY from .env. Tailscale serves this
  # desk at https://<host>.<tailnet>.ts.net through `tailscale serve`
  # and TLS-terminates there; the serve container is never public
  # off the tailnet.
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:stable
    restart: unless-stopped
    environment:
      # Required for this profile. Not `:?`: compose resolves every
      # service before profiles apply, so that would stop a plain `up`.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: ${TS_HOSTNAME:-devcules}
      TS_EXTRA_ARGS: --reset
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    depends_on:
      serve:
        condition: service_healthy
    # Bring the tailnet name up as the desk's HTTPS front once serve
    # answers: `tailscale serve` forwards to the container.
    command: >
      sh -c "tailscaled --tun=userspace-networking --statedir=/var/lib/tailscale --socket=/tmp/tailscaled.sock &
             tailscale --socket=/tmp/tailscaled.sock login --auth-key=$${TS_AUTHKEY} --hostname=$${TS_HOSTNAME} &&
             tailscale --socket=/tmp/tailscaled.sock serve --bg --https=443 http://serve:7659 &&
             wait"

volumes:
  devcules-data:
  runner-home:
  link:
  tailscale-state:
