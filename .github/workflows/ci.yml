name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job below can read the repo and nothing else.
permissions:
  contents: read

# A newer push on the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.2.2"
          install-go: false
      - name: web lint and typecheck
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web exec -- tsc --noEmit

  arch:
    name: arch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: architecture test
        run: go test -count=1 -run 'TestModuleBoundaries' .

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: unit (go)
        run: |
          go test -race -cover ./... 2>&1 | tee test.out
          test ${PIPESTATUS[0]} -eq 0
      - name: coverage gate (70% per touched package)
        run: |
          awk '
            /\[[^]]*no test files[^]]*\]/ { untested[$2] = 1; next }
            /coverage: [0-9.]+% of statements/ {
              pct = $(NF-2); sub(/%$/, "", pct)
              if (pct + 0 < 70) low[$2] = pct
              seen++
            }
            END {
              for (p in untested) { print "FAIL: " p " has Go files but no tests"; bad = 1 }
              for (p in low) { print "FAIL: " p " coverage " low[p] "% is below 70%"; bad = 1 }
              if (!bad && seen == 0) print "SKIP: no coverable Go statements yet; the 70% gate activates with the first package (M0.2)."
              if (!bad && seen > 0) print "OK: every covered package is at or above 70%."
              exit bad
            }' test.out
          rm -f test.out
      - name: unit (web)
        run: |
          npm --prefix web ci
          npm --prefix web exec -- vitest run

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: smoke
        run: |
          if [ ! -f deploy/compose.yaml ]; then
            echo "SKIP: deploy/compose.yaml does not exist yet (compose lands in M0.5); nothing to smoke-test."
            exit 0
          fi
          if ! docker compose -f deploy/compose.yaml up -d --wait; then
            docker compose -f deploy/compose.yaml logs --no-color
            docker compose -f deploy/compose.yaml down -v
            exit 1
          fi
          status=0
          ./scripts/smoke.sh || status=$?
          docker compose -f deploy/compose.yaml down -v
          exit $status

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        run: |
          npm --prefix e2e ci
          npx --prefix e2e playwright install --with-deps chromium webkit
      - name: Start the stack
        run: |
          if ! docker compose -f deploy/compose.yaml up -d --wait; then
            docker compose -f deploy/compose.yaml logs --no-color
            docker compose -f deploy/compose.yaml down -v
            exit 1
          fi
      - name: Playwright sign-in
        run: E2E_ADMIN_PASSWORD="$(./scripts/get-admin-password.sh)" npm --prefix e2e test
      # ONE-SHOT baseline capture (temporary, reverted once the real
      # baselines land): writes the -linux PNGs instead of comparing,
      # then uploads them. Squash-merge keeps main clean.
      - name: Playwright visual baselines
        run: E2E_ADMIN_PASSWORD="$(./scripts/get-admin-password.sh)" npm --prefix e2e run test:visual -- --update-snapshots
      - name: Upload fresh baselines
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-baselines
          path: e2e/tests/visual.spec.js-snapshots/
          if-no-files-found: error
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --source . --verbose
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: npm audit
        run: |
          npm --prefix web ci
          npm --prefix web audit --omit=dev
      - name: web licence check
        run: |
          npm --prefix web ci
          npm --prefix web exec -- license-checker --production --excludePrivatePackages \
            --onlyAllow 'MIT;BSD-2-Clause;BSD-3-Clause;ISC;Apache-2.0'
      - name: licence check
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          "$(go env GOPATH)/bin/go-licenses" check ./... \
            --allowed_licenses=MIT,BSD-2-Clause,BSD-3-Clause,ISC,Apache-2.0
