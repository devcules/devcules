# GoReleaser config for the `devcules` binary releases.
# Used by .github/workflows/release.yml on `v*` tags. The cmd/devcules
# entrypoint lands in M0.2; until then the workflow skips the build.
version: 2

project_name: devcules

builds:
  - id: devcules
    main: ./cmd/devcules
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s, -w]

archives:
  - id: devcules
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
